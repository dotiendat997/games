<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Đếm Số - Bé Vui Chơi</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; touch-action: manipulation; user-select: none;
    font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
  }
  body { background: linear-gradient(135deg, #eef9ff, #fff7e6, #f2ffef); }

  #startScreen {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
    background: radial-gradient(circle at 50% 30%, #ffffff, #e9f6ff);
  }
  #startScreen h1 { font-size: clamp(28px, 8vw, 56px); color: #1f6f8b; margin: 0; text-align: center; text-shadow: 0 3px 0 #fff; }
  #startEmoji { font-size: clamp(60px, 18vw, 130px); animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-16px) rotate(4deg);} }
  #startBtn {
    font-size: clamp(20px, 5vw, 34px); font-weight: 800; color: #fff;
    background: linear-gradient(135deg,#2ec4b6,#ff9f1c);
    border: none; border-radius: 999px; padding: 18px 48px;
    box-shadow: 0 8px 0 #1b8a7e, 0 14px 24px rgba(0,0,0,.2); cursor: pointer;
  }
  #startBtn:active { transform: translateY(6px); box-shadow: 0 2px 0 #1b8a7e; }

  #stage { position: fixed; inset: 0; overflow: hidden; }

  #muteBtn {
    position: fixed; top: 14px; right: 14px; z-index: 60;
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: #ffffffdd; font-size: 24px; cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.15);
  }

  #caption {
    position: fixed; left: 0; right: 0; top: 12px; text-align: center; padding: 0 70px;
    font-size: clamp(22px, 5vw, 44px); font-weight: 900; color: #1f6f8b;
    text-shadow: 0 3px 0 #fff; pointer-events: none; min-height: 1.3em; z-index: 5;
  }

  #tile {
    position: absolute; left: 50%; top: 16%; transform: translateX(-50%);
    width: var(--tile); height: var(--tile);
    cursor: pointer; z-index: 3; touch-action: manipulation;
  }
  #tileFace {
    width: 100%; height: 100%; border-radius: 36%;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--tile) * 0.62); font-weight: 900; color: #fff; line-height: 1;
    box-shadow: 0 10px 0 rgba(0,0,0,.18), 0 16px 26px rgba(0,0,0,.18);
    text-shadow: 0 4px 0 rgba(0,0,0,.15);
    animation: hop 0.9s ease-in-out infinite;
  }
  @keyframes hop {
    0%, 100% { transform: translateY(0) scale(1.06, 0.92); }
    20%      { transform: translateY(0) scale(1, 1); }
    50%      { transform: translateY(-14%) scale(0.96, 1.05); }
    80%      { transform: translateY(0) scale(1, 1); }
  }
  #tile.pick #tileFace { animation: spin .8s ease; }
  @keyframes spin {
    0%   { transform: rotate(0) scale(1); }
    50%  { transform: rotate(180deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
  }

  #field {
    position: absolute; left: 0; right: 0; top: 52%; bottom: 13%;
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    gap: 8px; padding: 0 12px; pointer-events: none; z-index: 2;
  }
  #field img {
    width: var(--it); height: var(--it); opacity: 0; transform: scale(0.3);
    transition: opacity .25s ease, transform .4s cubic-bezier(.2,1.6,.4,1);
  }
  #field img.in { opacity: 1; transform: scale(1); }

  #nav {
    position: fixed; left: 0; right: 0; bottom: 14px; z-index: 6;
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  .navBtn {
    width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer;
    background: #ffffffee; font-size: 28px; font-weight: 900; color: #1f6f8b;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
  }
  .navBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .navBtn:disabled { opacity: .35; }
  #dots { display: flex; gap: 8px; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%; background: #c9dde6; border: none; padding: 0; cursor: pointer;
  }
  .dot.on { transform: scale(1.35); background: #1f6f8b; }
</style>
</head>
<body>

<div id="startScreen">
  <div id="startEmoji">🔢</div>
  <h1>Đếm Số<br>Bé Vui Chơi</h1>
  <button id="startBtn">Bắt đầu chơi ▶</button>
</div>

<button id="muteBtn" aria-label="Tắt/bật âm thanh">🔊</button>
<div id="stage">
  <div id="field"></div>
  <div id="tile"><div id="tileFace"></div></div>
</div>
<div id="caption"></div>
<div id="nav">
  <button class="navBtn" id="prevBtn" aria-label="Số trước">◀</button>
  <div id="dots"></div>
  <button class="navBtn" id="nextBtn" aria-label="Số sau">▶</button>
</div>

<script>
(function () {
  "use strict";

  var TWEMOJI_BASE = "https://cdn.jsdelivr.net/npm/@twemoji/svg@15.0.0/";
  var NUM_WORDS = ["Một", "Hai", "Ba", "Bốn", "Năm", "Sáu", "Bảy", "Tám", "Chín"];
  var ITEMS = [
    { cp: "1f388", name: "bong bóng", clip: "audio/obj-bong-bong.mp3" },
    { cp: "1f338", name: "bông hoa", clip: "audio/obj-bong-hoa.mp3" },
    { cp: "2b50", name: "ngôi sao", clip: "audio/obj-ngoi-sao.mp3" },
    { cp: "1f34e", name: "quả táo", clip: "audio/obj-qua-tao.mp3" },
    { cp: "1f41f", name: "con cá", clip: "audio/obj-con-ca.mp3" }
  ];
  var COLORS = ["#ff6b6b", "#ff9f43", "#f0b400", "#1dd1a1", "#2e9bff", "#7a5cff", "#ff6fb5", "#00b8c4", "#8bc34a"];
  var PLAYBACK_RATE = 1.15;
  var STEP_GAP_MS = 260;

  var muted = false;
  var audioCtx = null;
  var clipCache = {};
  var runId = 0;
  var busy = false;
  var page = 1;
  var lastItem = -1;

  var stage = document.getElementById("stage");
  var tile = document.getElementById("tile");
  var tileFace = document.getElementById("tileFace");
  var field = document.getElementById("field");
  var caption = document.getElementById("caption");
  var muteBtn = document.getElementById("muteBtn");
  var startScreen = document.getElementById("startScreen");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var dotsEl = document.getElementById("dots");

  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function tick(pitch) {
    if (muted || !audioCtx) return;
    var t0 = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.value = pitch;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.16);
  }

  function getClip(src) {
    if (!clipCache[src]) {
      clipCache[src] = new Audio(src);
      clipCache[src].preload = "auto";
    }
    return clipCache[src];
  }

  // Plays clips one after another; calls done() when all have finished.
  function playSeq(srcs, token, done) {
    var i = 0;
    function next() {
      if (token !== runId) return;
      if (i >= srcs.length || muted) { if (done) done(); return; }
      var clip = getClip(srcs[i++]);
      clip.currentTime = 0;
      clip.playbackRate = PLAYBACK_RATE;
      clip.onended = next;
      clip.onerror = next;
      try {
        var p = clip.play();
        if (p && p.catch) p.catch(next);
      } catch (e) { next(); }
    }
    next();
  }

  function wait(ms, token, fn) {
    setTimeout(function () { if (token === runId) fn(); }, ms);
  }

  function tileSize() {
    return Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.3);
  }

  function sizeItems(n) {
    var cols = n <= 3 ? n : n <= 6 ? 3 : 5;
    var w = window.innerWidth;
    var h = window.innerHeight * 0.35;
    var rows = Math.ceil(n / cols);
    var sz = Math.min((w - 24) / cols - 8, (h - 16) / rows - 8, 180);
    return Math.max(60, Math.floor(sz));
  }

  function pickItem() {
    var i;
    do { i = Math.floor(Math.random() * ITEMS.length); } while (i === lastItem && ITEMS.length > 1);
    lastItem = i;
    return ITEMS[i];
  }

  function renderPage() {
    runId++;
    busy = false;
    field.innerHTML = "";
    caption.textContent = "";
    stage.style.setProperty("--tile", tileSize() + "px");
    tileFace.textContent = String(page);
    tileFace.style.background = COLORS[page - 1];
    tile.classList.remove("pick");

    prevBtn.disabled = page === 1;
    nextBtn.disabled = page === 9;
    Array.prototype.forEach.call(dotsEl.children, function (d, i) {
      d.classList.toggle("on", i + 1 === page);
    });
  }

  function goPage(p) {
    if (p < 1 || p > 9) return;
    page = p;
    renderPage();
  }

  function playCount(n) {
    ensureAudio();
    runId++;
    var token = runId;
    busy = true;
    field.innerHTML = "";
    caption.textContent = "";
    tile.classList.remove("pick");
    void tile.offsetWidth;
    tile.classList.add("pick");

    var item = pickItem();
    field.style.setProperty("--it", sizeItems(n) + "px");

    var steps = [];
    steps.push({ audio: ["audio/so.mp3", "audio/num-" + n + ".mp3"], caption: "Số " + NUM_WORDS[n - 1] });
    for (var k = 1; k <= n; k++) {
      steps.push({ show: true, audio: ["audio/num-" + k + ".mp3", item.clip], caption: k + " " + item.name });
    }
    steps.push({ audio: ["audio/co.mp3", "audio/num-" + n + ".mp3", item.clip], caption: "Có " + n + " " + item.name });

    var shown = 0;
    function run(idx) {
      if (token !== runId) return;
      if (idx >= steps.length) { busy = false; return; }
      var s = steps[idx];
      caption.textContent = s.caption;
      if (s.show) {
        shown++;
        var img = document.createElement("img");
        img.src = TWEMOJI_BASE + item.cp + ".svg";
        img.alt = "";
        img.draggable = false;
        field.appendChild(img);
        requestAnimationFrame(function () { img.classList.add("in"); });
        tick(480 + shown * 90);
      }
      playSeq(s.audio, token, function () {
        wait(STEP_GAP_MS, token, function () { run(idx + 1); });
      });
    }
    run(0);
  }

  tile.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (busy) return;
    playCount(page);
  });

  for (var d = 1; d <= 9; d++) {
    var dot = document.createElement("button");
    dot.className = "dot";
    dot.setAttribute("aria-label", "Trang số " + d);
    (function (d) {
      dot.addEventListener("click", function () { goPage(d); });
    })(d);
    dotsEl.appendChild(dot);
  }

  prevBtn.addEventListener("click", function () { goPage(page - 1); });
  nextBtn.addEventListener("click", function () { goPage(page + 1); });

  document.getElementById("startBtn").addEventListener("click", function () {
    ensureAudio();
    startScreen.style.display = "none";
    renderPage();
  });

  muteBtn.addEventListener("click", function () {
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
  });

  window.addEventListener("resize", function () {
    if (startScreen.style.display === "none") stage.style.setProperty("--tile", tileSize() + "px");
  });

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
