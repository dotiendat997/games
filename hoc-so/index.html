<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Học Số - Bé Vui Chơi</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; touch-action: none; user-select: none;
    font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
  }
  body { background: linear-gradient(135deg, #e3f2ff, #fff3d6, #e6ffe9); }

  #startScreen {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
    background: radial-gradient(circle at 50% 30%, #fff8e6, #dff0ff);
  }
  #startScreen h1 { font-size: clamp(28px, 8vw, 56px); color: #2a5d9f; margin: 0; text-align: center; text-shadow: 0 3px 0 #fff; }
  #startEmoji { font-size: clamp(60px, 18vw, 130px); animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-16px) rotate(4deg);} }
  #startBtn {
    font-size: clamp(20px, 5vw, 34px); font-weight: 800; color: #fff;
    background: linear-gradient(135deg,#4ea8ff,#ffb84d);
    border: none; border-radius: 999px; padding: 18px 48px;
    box-shadow: 0 8px 0 #2a6fb8, 0 14px 24px rgba(0,0,0,.2); cursor: pointer;
  }
  #startBtn:active { transform: translateY(6px); box-shadow: 0 2px 0 #2a6fb8; }

  #stage { position: fixed; inset: 0; overflow: hidden; }

  #muteBtn {
    position: fixed; top: 14px; right: 14px; z-index: 60;
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: #ffffffdd; font-size: 24px; cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.15);
  }

  #tile {
    position: absolute; left: 0; top: 0;
    width: var(--tile); height: var(--tile);
    transition: left .6s cubic-bezier(.3,1.4,.5,1), top .6s cubic-bezier(.3,1.4,.5,1);
    cursor: pointer; z-index: 3; touch-action: manipulation;
  }
  #tileFace {
    width: 100%; height: 100%; border-radius: 36%;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--tile) * 0.62); font-weight: 900; color: #fff; line-height: 1;
    box-shadow: 0 10px 0 rgba(0,0,0,.18), 0 16px 26px rgba(0,0,0,.18);
    animation: hop 0.9s ease-in-out infinite;
    text-shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  @keyframes hop {
    0%, 100% { transform: translateY(0) scale(1.06, 0.92); }
    20%      { transform: translateY(0) scale(1, 1); }
    50%      { transform: translateY(-14%) scale(0.96, 1.05); }
    80%      { transform: translateY(0) scale(1, 1); }
  }
  #tile.pick #tileFace { animation: spin .8s ease; }
  @keyframes spin {
    0%   { transform: rotate(0) scale(1); }
    50%  { transform: rotate(180deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
  }

  #countArea {
    position: absolute; left: 0; right: 0; bottom: 12%;
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    gap: 10px; padding: 0 12px; pointer-events: none;
  }
  #countArea img {
    width: clamp(64px, 14vmin, 120px); height: clamp(64px, 14vmin, 120px);
    opacity: 0; transform: scale(0.3);
    transition: opacity .25s ease, transform .35s cubic-bezier(.2,1.6,.4,1);
  }
  #countArea img.in { opacity: 1; transform: scale(1); }

  #caption {
    position: fixed; left: 0; right: 0; top: 10%; text-align: center;
    font-size: clamp(28px, 7vw, 56px); font-weight: 900; color: #2a5d9f;
    text-shadow: 0 3px 0 #fff; pointer-events: none; opacity: 0;
  }
  #caption.show { animation: captionPop 1.6s ease forwards; }
  @keyframes captionPop {
    0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; }
  }
</style>
</head>
<body>

<div id="startScreen">
  <div id="startEmoji">🔢</div>
  <h1>Học Số<br>Bé Vui Chơi</h1>
  <button id="startBtn">Bắt đầu chơi ▶</button>
</div>

<button id="muteBtn" aria-label="Tắt/bật âm thanh">🔊</button>
<div id="stage">
  <div id="countArea"></div>
  <div id="tile"><div id="tileFace"></div></div>
</div>
<div id="caption"></div>

<script>
(function () {
  "use strict";

  var TWEMOJI_BASE = "https://cdn.jsdelivr.net/npm/@twemoji/svg@15.0.0/";
  var OBJECTS = ["1f34e", "2b50", "1f388", "1f338"]; // táo, sao, bóng bay, hoa
  var WORDS = ["Một", "Hai", "Ba", "Bốn", "Năm", "Sáu", "Bảy", "Tám", "Chín"];
  var COLORS = ["#ff6b6b", "#ff9f43", "#f0b400", "#1dd1a1", "#2e9bff", "#7a5cff", "#ff6fb5", "#00b8c4", "#8bc34a"];
  var NEXT_DELAY_MS = 3200;

  var muted = false;
  var audioCtx = null;
  var clipCache = {};
  var countTimers = [];
  var nextTimer = null;
  var current = 0;
  var busy = false;

  var stage = document.getElementById("stage");
  var tile = document.getElementById("tile");
  var tileFace = document.getElementById("tileFace");
  var countArea = document.getElementById("countArea");
  var caption = document.getElementById("caption");
  var muteBtn = document.getElementById("muteBtn");
  var startScreen = document.getElementById("startScreen");

  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function tick(pitch) {
    if (muted || !audioCtx) return;
    var t0 = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.value = pitch;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.16);
  }

  function playNumberClip(n) {
    if (muted) return;
    var src = "audio/num-" + n + ".mp3";
    if (!clipCache[src]) {
      clipCache[src] = new Audio(src);
      clipCache[src].preload = "auto";
    }
    var clip = clipCache[src];
    try {
      clip.currentTime = 0;
      var p = clip.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  function showCaption(text) {
    caption.textContent = text;
    caption.classList.remove("show");
    void caption.offsetWidth;
    caption.classList.add("show");
  }

  function clearCount() {
    countTimers.forEach(clearTimeout);
    countTimers = [];
    countArea.innerHTML = "";
  }

  function tileSize() {
    return Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.38);
  }

  function placeTile(animate) {
    var size = tileSize();
    stage.style.setProperty("--tile", size + "px");
    var maxX = Math.max(0, window.innerWidth - size - 16);
    var minY = window.innerHeight * 0.18;
    var maxY = Math.max(minY, window.innerHeight * 0.55 - size);
    var x = 16 + Math.random() * Math.max(0, maxX - 16);
    var y = minY + Math.random() * Math.max(0, maxY - minY);
    tile.style.transition = animate ? "" : "none";
    tile.style.left = x + "px";
    tile.style.top = y + "px";
    if (!animate) { void tile.offsetWidth; tile.style.transition = ""; }
  }

  function pickNext() {
    var n;
    do { n = 1 + Math.floor(Math.random() * 9); } while (n === current);
    return n;
  }

  function showNumberTile(n) {
    current = n;
    tileFace.textContent = String(n);
    tileFace.style.background = COLORS[n - 1];
    placeTile(true);
    tile.classList.remove("pick");
    busy = false;
  }

  function reveal() {
    if (busy || !current) return;
    busy = true;
    ensureAudio();
    if (nextTimer) clearTimeout(nextTimer);
    clearCount();
    tile.classList.remove("pick");
    void tile.offsetWidth;
    tile.classList.add("pick");

    showCaption(current + " - " + WORDS[current - 1]);
    playNumberClip(current);

    var obj = OBJECTS[Math.floor(Math.random() * OBJECTS.length)];
    for (var i = 0; i < current; i++) {
      (function (i) {
        countTimers.push(setTimeout(function () {
          var img = document.createElement("img");
          img.src = TWEMOJI_BASE + obj + ".svg";
          img.alt = "";
          img.draggable = false;
          countArea.appendChild(img);
          requestAnimationFrame(function () { img.classList.add("in"); });
          tick(520 + i * 90);
        }, 450 + i * 420));
      })(i);
    }

    nextTimer = setTimeout(function () {
      clearCount();
      showNumberTile(pickNext());
    }, NEXT_DELAY_MS);
  }

  tile.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    reveal();
  });

  document.getElementById("startBtn").addEventListener("click", function () {
    ensureAudio();
    startScreen.style.display = "none";
    showNumberTile(pickNext());
  });

  muteBtn.addEventListener("click", function () {
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
  });

  window.addEventListener("resize", function () {
    if (current) placeTile(false);
  });

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
