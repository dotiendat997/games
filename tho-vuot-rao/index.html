<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Thỏ Vượt Rào</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; touch-action: none; user-select: none;
    font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
  }
  body {
    background: linear-gradient(180deg, #8ed2ff 0%, #bfe8ff 55%, #d8f5c9 55%, #8fd66b 100%);
  }

  #sun {
    position: fixed; top: 6%; right: 8%; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, #fff6b0, #ffd95e 60%, rgba(255,216,94,0) 70%);
    box-shadow: 0 0 60px 20px rgba(255, 232, 150, 0.5);
    z-index: 1; pointer-events: none;
  }
  #bgLayer { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .cloud { position: absolute; font-size: 46px; opacity: .9; animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-15vw); } to { transform: translateX(115vw); } }
  .tree { position: absolute; bottom: 6%; font-size: 60px; }

  #rabbits { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .rabbit { position: absolute; top: 0; left: 0; width: 56px; height: 56px; will-change: transform; }
  .rabbit svg { display: block; width: 100%; height: 100%; overflow: visible; }

  #draw { position: fixed; inset: 0; z-index: 3; touch-action: none; }

  .sparkle { position: fixed; top: 0; left: 0; font-size: 26px; pointer-events: none; z-index: 7; will-change: transform, opacity; }

  #topBar {
    position: fixed; top: 14px; left: 0; right: 0; z-index: 6;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 14px; pointer-events: none;
  }
  #title {
    flex: 1; text-align: center; font-size: clamp(18px, 4.4vw, 32px);
    font-weight: 800; color: #2f6d3a; text-shadow: 0 2px 0 #fff;
  }
  .roundBtn {
    pointer-events: auto; width: 52px; height: 52px; border-radius: 50%; border: none;
    background: #ffffffdd; font-size: 24px; cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.15);
  }

  #startScreen {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(circle at 50% 30%, #eaffd8, #c8f0ff);
    text-align: center; padding: 20px;
  }
  #startScreen h1 { font-size: clamp(26px, 7.5vw, 50px); color: #2f6d3a; margin: 0; text-shadow: 0 3px 0 #fff; }
  #startScreen p { font-size: clamp(15px, 3.6vw, 20px); color: #3a6b2e; max-width: 480px; margin: 0; }
  #startEmoji { width: clamp(56px, 18vw, 120px); height: clamp(56px, 18vw, 120px); animation: bob 1.5s ease-in-out infinite; }
  #startEmoji svg { display: block; width: 100%; height: 100%; overflow: visible; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-16px) rotate(4deg); } }
  #startBtn {
    font-size: clamp(20px, 5vw, 32px); font-weight: 800; color: #fff;
    background: linear-gradient(135deg,#7ed957,#3aa6ff);
    border: none; border-radius: 999px; padding: 18px 46px;
    box-shadow: 0 8px 0 #2c8a49, 0 14px 24px rgba(0,0,0,.2); cursor: pointer;
  }
  #startBtn:active { transform: translateY(6px); box-shadow: 0 2px 0 #2c8a49; }
</style>
</head>
<body>

<div id="sun"></div>
<div id="bgLayer"></div>
<div id="rabbits"></div>
<canvas id="draw"></canvas>

<div id="topBar">
  <button class="roundBtn" id="clearBtn" aria-label="Xóa nét vẽ">🧹</button>
  <div id="title">Vẽ Cầu Vồng Chặn Thỏ 🐰</div>
  <button class="roundBtn" id="muteBtn" aria-label="Tắt/bật âm thanh">🔊</button>
</div>

<div id="startScreen">
  <div id="startEmoji"></div>
  <h1>Thỏ Vượt Rào</h1>
  <p>Dùng tay vẽ đường cầu vồng để chặn đàn thỏ — thỏ sẽ tìm mọi cách nhảy qua, chui dưới, hoặc vòng qua đường bạn vẽ!</p>
  <button id="startBtn">Bắt đầu chơi ▶</button>
</div>

<script>
(function () {
  "use strict";

  var LANE_COUNT = 3;
  var RABBIT_SIZE = 56;
  var RABBIT_COUNT = 6;
  var GROUND_TOP_RATIO = 0.60;
  var LANE_GAP = 46;

  var BLOCK_WAIT_MS = 420;
  var JUMP_MS = 520, JUMP_HEIGHT = 74;
  var DUCK_MS = 420;
  var RETREAT_MS = 650;

  var STROKE_WIDTH = 16;
  var STROKE_LIFETIME = 6000;
  var STROKE_FADE = 2500;
  var MAX_TOTAL_POINTS = 2600;
  var SENSOR_RADIUS = 14;

  var BUNNY_SVG =
    '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
    '<g transform="rotate(-12 34 20)">' +
    '<rect x="26" y="2" width="16" height="40" rx="8" fill="#ffffff" stroke="#d7d7e2" stroke-width="2"/>' +
    '<rect x="30" y="9" width="8" height="26" rx="4" fill="#ffc2dc"/>' +
    '</g>' +
    '<g transform="rotate(12 66 20)">' +
    '<rect x="58" y="2" width="16" height="40" rx="8" fill="#ffffff" stroke="#d7d7e2" stroke-width="2"/>' +
    '<rect x="62" y="9" width="8" height="26" rx="4" fill="#ffc2dc"/>' +
    '</g>' +
    '<circle cx="50" cy="68" r="27" fill="#ffffff" stroke="#d7d7e2" stroke-width="2"/>' +
    '<ellipse cx="38" cy="94" rx="9" ry="5" fill="#ffffff" stroke="#d7d7e2" stroke-width="2"/>' +
    '<ellipse cx="62" cy="94" rx="9" ry="5" fill="#ffffff" stroke="#d7d7e2" stroke-width="2"/>' +
    '<circle cx="50" cy="40" r="21" fill="#ffffff" stroke="#d7d7e2" stroke-width="2"/>' +
    '<ellipse cx="34" cy="46" rx="5" ry="3" fill="#ffd6e8" opacity="0.7"/>' +
    '<ellipse cx="66" cy="46" rx="5" ry="3" fill="#ffd6e8" opacity="0.7"/>' +
    '<circle cx="42" cy="40" r="2.6" fill="#3a3a3a"/>' +
    '<circle cx="58" cy="40" r="2.6" fill="#3a3a3a"/>' +
    '<path d="M50 44 l-3.2 4.2 h6.4 z" fill="#ff8fc0"/>' +
    '</svg>';

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ---- Audio (synthesized, no external files) ----
  var muted = false;
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function tone(freq, t0, dur, gainPeak) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainPeak, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function playBoing() {
    if (muted || !audioCtx) return;
    var t0 = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(300, t0);
    osc.frequency.exponentialRampToValueAtTime(700, t0 + 0.18);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.26);
  }
  function playCleared() {
    if (muted || !audioCtx) return;
    var t0 = audioCtx.currentTime;
    tone(660, t0, 0.18, 0.18);
    tone(880, t0 + 0.08, 0.2, 0.18);
  }

  // ---- Background decoration ----
  var bgLayer = document.getElementById("bgLayer");
  function buildBackground() {
    bgLayer.innerHTML = "";
    var w = window.innerWidth, h = window.innerHeight;
    var clouds = ["☁️", "☁️", "☁️", "☁️"];
    clouds.forEach(function (c, i) {
      var el = document.createElement("div");
      el.className = "cloud";
      el.textContent = c;
      el.style.top = rand(4, 30) + "%";
      el.style.left = "0px";
      var dur = rand(28, 48);
      el.style.animationDuration = dur + "s";
      el.style.animationDelay = "-" + rand(0, dur) + "s";
      bgLayer.appendChild(el);
    });
    var trees = ["🌴", "🌳", "🌴", "🌳"];
    var positions = [4, 18, 82, 94];
    trees.forEach(function (t, i) {
      var el = document.createElement("div");
      el.className = "tree";
      el.textContent = t;
      el.style.left = positions[i] + "%";
      bgLayer.appendChild(el);
    });
  }

  // ---- Drawing canvas ----
  var canvas = document.getElementById("draw");
  var ctx = canvas.getContext("2d");
  var DPR = Math.max(1, window.devicePixelRatio || 1);

  function resizeCanvas() {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  var strokes = [];
  var activeStrokes = {};
  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  // Each point carries its own timestamp, so a long unbroken stroke fades
  // from its oldest end while freshly drawn points stay solid.
  function onPointerDown(e) {
    ensureAudio();
    e.preventDefault();
    var p = getPos(e);
    var now = performance.now();
    var s = { points: [{ x: p.x, y: p.y, t: now }], hueBase: rand(0, 360), active: true };
    activeStrokes[e.pointerId] = s;
    strokes.push(s);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onPointerMove(e) {
    var s = activeStrokes[e.pointerId];
    if (!s) return;
    e.preventDefault();
    var p = getPos(e);
    var now = performance.now();
    var last = s.points[s.points.length - 1];
    var dx = p.x - last.x, dy = p.y - last.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var step = 6;
    if (dist > step) {
      var n = Math.floor(dist / step);
      for (var i = 1; i <= n; i++) {
        var t = i / n;
        s.points.push({ x: last.x + dx * t, y: last.y + dy * t, t: now });
      }
    } else if (dist > 0.5) {
      s.points.push({ x: p.x, y: p.y, t: now });
    }
    if (s.points.length > MAX_TOTAL_POINTS) s.points.splice(0, s.points.length - MAX_TOTAL_POINTS);
  }
  function onPointerUp(e) {
    var s = activeStrokes[e.pointerId];
    if (s) s.active = false;
    delete activeStrokes[e.pointerId];
  }

  canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
  canvas.addEventListener("pointermove", onPointerMove, { passive: false });
  canvas.addEventListener("pointerup", onPointerUp, { passive: false });
  canvas.addEventListener("pointercancel", onPointerUp, { passive: false });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  function pointOpacity(age) {
    return age < STROKE_LIFETIME ? 1 : clamp(1 - (age - STROKE_LIFETIME) / STROKE_FADE, 0, 1);
  }

  function drawStrokes(now) {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = STROKE_WIDTH;
    for (var i = strokes.length - 1; i >= 0; i--) {
      var s = strokes[i];
      while (s.points.length && now - s.points[0].t > STROKE_LIFETIME + STROKE_FADE) s.points.shift();
      if (!s.points.length) {
        if (!s.active) strokes.splice(i, 1);
        continue;
      }
      var pts = s.points;
      for (var j = 1; j < pts.length; j++) {
        var opacity = pointOpacity(now - pts[j].t);
        if (opacity <= 0) continue;
        var hue = (j * 9 + s.hueBase) % 360;
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = "hsl(" + hue + ",85%,58%)";
        ctx.beginPath();
        ctx.moveTo(pts[j - 1].x, pts[j - 1].y);
        ctx.lineTo(pts[j].x, pts[j].y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function isBlocked(px, py, radius, now) {
    var thresh = radius + STROKE_WIDTH / 2;
    var thresh2 = thresh * thresh;
    for (var i = 0; i < strokes.length; i++) {
      var pts = strokes[i].points;
      for (var j = 0; j < pts.length; j++) {
        if (now - pts[j].t > STROKE_LIFETIME) continue; // faded points no longer block
        var dx = pts[j].x - px, dy = pts[j].y - py;
        if (dx * dx + dy * dy < thresh2) return true;
      }
    }
    return false;
  }

  // ---- Rabbits ----
  var rabbitsLayer = document.getElementById("rabbits");
  var rabbits = [];

  function laneY(i) {
    return window.innerHeight * GROUND_TOP_RATIO + i * LANE_GAP;
  }
  function pickOtherLane(current) {
    if (LANE_COUNT <= 1) return current;
    var l;
    do { l = Math.floor(Math.random() * LANE_COUNT); } while (l === current);
    return l;
  }

  function makeRabbit(i) {
    var el = document.createElement("div");
    el.className = "rabbit";
    el.innerHTML = BUNNY_SVG;
    rabbitsLayer.appendChild(el);
    var lane = i % LANE_COUNT;
    return {
      el: el,
      x: -RABBIT_SIZE - rand(0, 400),
      lane: lane,
      y: laneY(lane),
      speed: rand(38, 72),
      state: "walk",
      stateT: 0,
      hop: 0,
      squish: 1,
      bobPhase: rand(0, Math.PI * 2),
      targetLane: lane
    };
  }

  function spawnRabbits() {
    rabbitsLayer.innerHTML = "";
    rabbits = [];
    for (var i = 0; i < RABBIT_COUNT; i++) rabbits.push(makeRabbit(i));
  }

  function burstSparkle(x, y) {
    var glyphs = ["✨", "💫", "🌟"];
    for (var i = 0; i < 4; i++) {
      var p = document.createElement("div");
      p.className = "sparkle";
      p.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      document.body.appendChild(p);
      var angle = rand(0, Math.PI * 2);
      var dist = rand(20, 50);
      var dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist - 20;
      var start = performance.now();
      var dur = 500;
      (function (p, x, y, dx, dy, start, dur) {
        function step(now) {
          var t = Math.min(1, (now - start) / dur);
          p.style.transform = "translate(" + (x + dx * t) + "px," + (y + dy * t) + "px) scale(" + (1 - t * 0.5) + ")";
          p.style.opacity = String(1 - t);
          if (t < 1) requestAnimationFrame(step);
          else if (p.parentNode) p.parentNode.removeChild(p);
        }
        requestAnimationFrame(step);
      })(p, x, y, dx, dy, start, dur);
    }
  }

  function updateRabbit(r, dt, now) {
    switch (r.state) {
      case "walk": {
        r.x += r.speed * dt;
        r.bobPhase += dt * 6;
        var frontX = r.x + RABBIT_SIZE * 0.8;
        var frontY = r.y + RABBIT_SIZE * 0.5;
        if (isBlocked(frontX, frontY, SENSOR_RADIUS, now)) {
          r.state = "blocked";
          r.stateT = 0;
        }
        break;
      }
      case "blocked": {
        r.stateT += dt * 1000;
        if (r.stateT > BLOCK_WAIT_MS) {
          var roll = Math.random();
          if (roll < 0.45) { r.state = "jump"; r.stateT = 0; playBoing(); }
          else if (roll < 0.7) { r.state = "duck"; r.stateT = 0; }
          else { r.state = "retreat"; r.stateT = 0; r.targetLane = pickOtherLane(r.lane); }
        }
        break;
      }
      case "jump": {
        r.stateT += dt * 1000;
        var t = Math.min(1, r.stateT / JUMP_MS);
        r.hop = Math.sin(t * Math.PI) * JUMP_HEIGHT;
        r.x += r.speed * 1.1 * dt;
        if (t >= 1) { r.hop = 0; r.state = "walk"; burstSparkle(r.x, r.y); playCleared(); }
        break;
      }
      case "duck": {
        r.stateT += dt * 1000;
        var td = Math.min(1, r.stateT / DUCK_MS);
        r.squish = 1 - Math.sin(td * Math.PI) * 0.38;
        r.x += r.speed * 0.55 * dt;
        if (td >= 1) { r.squish = 1; r.state = "walk"; burstSparkle(r.x, r.y); playCleared(); }
        break;
      }
      case "retreat": {
        r.stateT += dt * 1000;
        var tr = Math.min(1, r.stateT / RETREAT_MS);
        r.x -= r.speed * 0.45 * dt;
        r.y = lerp(laneY(r.lane), laneY(r.targetLane), tr);
        if (tr >= 1) { r.lane = r.targetLane; r.y = laneY(r.lane); r.state = "walk"; }
        break;
      }
    }

    if (r.x > window.innerWidth + RABBIT_SIZE) {
      r.x = -RABBIT_SIZE - rand(0, 160);
      r.lane = Math.floor(Math.random() * LANE_COUNT);
      r.y = laneY(r.lane);
      r.speed = rand(38, 72);
      r.state = "walk";
    }

    var bob = r.state === "walk" ? Math.sin(r.bobPhase) * 3 : 0;
    var ty = r.y - r.hop + bob;
    r.el.style.transform = "translate(" + r.x + "px," + ty + "px) scaleY(" + r.squish + ")";
  }

  // ---- Main loop ----
  var running = false;
  var lastT = null;

  function tick(now) {
    if (!running) return;
    if (lastT === null) lastT = now;
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    drawStrokes(now);
    for (var i = 0; i < rabbits.length; i++) updateRabbit(rabbits[i], dt, now);

    requestAnimationFrame(tick);
  }

  function startGame() {
    ensureAudio();
    document.getElementById("startScreen").style.display = "none";
    resizeCanvas();
    buildBackground();
    spawnRabbits();
    running = true;
    lastT = null;
    requestAnimationFrame(tick);
  }

  document.getElementById("startEmoji").innerHTML = BUNNY_SVG;

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("startBtn").addEventListener("touchend", function (e) { e.preventDefault(); startGame(); }, { passive: false });

  document.getElementById("muteBtn").addEventListener("click", function () {
    muted = !muted;
    this.textContent = muted ? "🔇" : "🔊";
  });
  document.getElementById("clearBtn").addEventListener("click", function () {
    strokes = [];
    activeStrokes = {};
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  });

  window.addEventListener("resize", function () {
    resizeCanvas();
    if (running) {
      for (var i = 0; i < rabbits.length; i++) rabbits[i].y = laneY(rabbits[i].lane);
    }
  });

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
